services:
  faimess-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: faimess-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FAIMESS_JWT_SECRET=${FAIMESS_JWT_SECRET:-faimess_jwt_secret_production_random_key_change_me}
      - FAIMESS_DRM_SECRET=${FAIMESS_DRM_SECRET:-faimess_drm_secret_production_random_key_change_me}
    volumes:
      - faimess-db-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  faimess-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faimess-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      faimess-backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  faimess-db-data:
