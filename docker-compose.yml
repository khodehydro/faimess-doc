services:
  faimess-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: faimess-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - faimess-db-data:/app/server/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  faimess-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faimess-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - faimess-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  faimess-db-data:
