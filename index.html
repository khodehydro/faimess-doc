<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the browser's own chrome (Android Chrome's address bar, the task
         switcher) wears the brand purple, not the grey canvas. The same hex
         is `--color-primary` in src/index.css; PreferencesContext re-reads
         that token when the appearance flips, so dark mode gets the dark
         theme's purple instead of this one. -->
    <meta name="theme-color" content="#8267f0" />
    <meta name="description" content="FAIMESS — a warm, soft-minimal studio dashboard." />

    <!-- the tab, the home-screen icon and the installed app's own header all
         come from these; `manifest.webmanifest` carries the same purple as
         `theme-color`, so an installed FAIMESS keeps the brand chrome. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="FAIMESS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FAIMESS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
